name: Release Please

on:
  push:
    branches:
      - main

permissions: write-all

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Release all packages in manifest
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json
          # Use RELEASE_PLEASE_TOKEN if available (required for org repos)
          # Otherwise fall back to GITHUB_TOKEN
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # Auto-merge release PRs
      - name: Enable auto-merge for release PRs
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Enable auto-merge for all created release PRs
          prs='${{ steps.release.outputs.prs }}'
          echo "$prs" | jq -r '.[].number' | while read -r pr_number; do
            echo "Enabling auto-merge for PR #$pr_number"
            gh pr merge "$pr_number" --auto --squash --repo ${{ github.repository }}
          done

      # Upload plugin archives as release assets
      - name: Checkout code
        if: ${{ steps.release.outputs.releases_created }}
        uses: actions/checkout@v4

      - name: Create and upload plugin archives
        if: ${{ steps.release.outputs.releases_created }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Parse the releases output JSON
          echo '${{ steps.release.outputs.releases_created }}' | jq -r '.[]' | while IFS= read -r release; do
            path=$(echo "$release" | jq -r '.path')
            tag_name=$(echo "$release" | jq -r '.tag_name')
            version=$(echo "$release" | jq -r '.version')

            # Extract plugin name from path (e.g., plugins/ai-platform -> ai-platform)
            plugin=$(basename "$path")

            # Create archive
            cd "$path"
            archive_name="${plugin}-${version}.tar.gz"
            tar -czf "../../${archive_name}" .
            cd ../..

            # Upload to release
            gh release upload "$tag_name" "$archive_name" --clobber

            echo "Uploaded $archive_name to release $tag_name"
          done
